<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_base.css">
<style>
  .row-s { display: grid; grid-template-columns: 50px 60px 1fr; align-items: center; gap: 16px; padding: 4px 0; }
  .bar { height: 14px; background: var(--brass-500); border-radius: 2px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg2); }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg4); }
</style></head>
<body><div class="card">
  <div class="col" style="gap: 0;">
    <div class="row-s"><span class="name">space-1</span><span class="px">4 px</span><span class="bar" style="width: 4px"></span></div>
    <div class="row-s"><span class="name">space-2</span><span class="px">8 px</span><span class="bar" style="width: 8px"></span></div>
    <div class="row-s"><span class="name">space-3</span><span class="px">12 px</span><span class="bar" style="width: 12px"></span></div>
    <div class="row-s"><span class="name">space-4</span><span class="px">16 px</span><span class="bar" style="width: 16px"></span></div>
    <div class="row-s"><span class="name">space-5</span><span class="px">20 px</span><span class="bar" style="width: 20px"></span></div>
    <div class="row-s"><span class="name">space-6</span><span class="px">24 px</span><span class="bar" style="width: 24px"></span></div>
    <div class="row-s"><span class="name">space-7</span><span class="px">32 px</span><span class="bar" style="width: 32px"></span></div>
    <div class="row-s"><span class="name">space-8</span><span class="px">40 px</span><span class="bar" style="width: 40px"></span></div>
    <div class="row-s"><span class="name">space-9</span><span class="px">56 px</span><span class="bar" style="width: 56px"></span></div>
    <div class="row-s"><span class="name">space-10</span><span class="px">72 px</span><span class="bar" style="width: 72px"></span></div>
  </div>
</div></body></html>

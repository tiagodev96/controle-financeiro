<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_base.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 64px; background: var(--bg-inset); border: 1px solid var(--border); }
  .pill { width: 96px; height: 28px; background: var(--brand-quiet-bg); border: 1px solid var(--border-soft); }
  .k { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg2); }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--fg4); }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="item"><div class="box" style="border-radius: 0"></div><span class="k">none</span><span class="v">0</span></div>
    <div class="item"><div class="box" style="border-radius: 2px"></div><span class="k">xs</span><span class="v">2 px</span></div>
    <div class="item"><div class="box" style="border-radius: 4px"></div><span class="k">sm</span><span class="v">4 px</span></div>
    <div class="item"><div class="box" style="border-radius: 6px"></div><span class="k">md</span><span class="v">6 px · default</span></div>
    <div class="item"><div class="box" style="border-radius: 10px"></div><span class="k">lg</span><span class="v">10 px · sheets</span></div>
    <div class="item"><div class="pill" style="border-radius: 9999px"></div><span class="k">full</span><span class="v">pills</span></div>
  </div>
  <div class="role" style="font-family:var(--font-mono);font-size:10.5px;color:var(--fg4);margin-top:-4px">Sharp radii. Sem rounding lúdico. Pill apenas em chips e status.</div>
</div></body></html>

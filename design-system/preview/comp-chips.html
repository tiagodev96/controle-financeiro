<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Category chips</title>
<link rel="stylesheet" href="_base.css">
<style>
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; min-height: 36px;
    padding: 6px 14px; border-radius: var(--radius-full);
    background: var(--bg-inset); border: 1px solid var(--border-soft);
    color: var(--fg2); font-family: var(--font-sans); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all var(--dur-fast) var(--ease-out);
  }
  .chip:hover { color: var(--fg1); border-color: var(--border); }
  .chip[aria-pressed="true"] {
    background: var(--brand-quiet-bg); color: var(--brand-quiet-fg);
    border-color: oklch(40% 0.08 80); font-weight: 600;
  }
  .chip svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .head { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg4); }
</style></head>
<body><div class="card">
  <div class="chips">
    <button class="chip" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M3 9.5l9-6 9 6V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/></svg>
      Moradia
    </button>
    <button class="chip">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>
      Alimentação
    </button>
    <button class="chip">
      <svg viewBox="0 0 24 24"><path d="M4 7h16l-2 12H6L4 7zm4-4h8v4H8z"/></svg>
      Pet
    </button>
    <button class="chip">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 5.5-9 10-9 10z"/></svg>
      Saúde
    </button>
    <button class="chip">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="1"/><path d="M3 10h18M8 3v6"/></svg>
      Lazer
    </button>
    <button class="chip">
      <svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M9 9h6v6H9z"/></svg>
      Ver todas
    </button>
  </div>
  <span class="head">Chip · 36px altura · radius full · uso: seletor de categoria no Lançar</span>
</div></body></html>

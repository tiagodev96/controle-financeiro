<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Tabular numerals</title>
<link rel="stylesheet" href="_base.css">
<style>
  table.demo { border-collapse: collapse; width: 100%; }
  table.demo td { padding: 6px 12px; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
  table.demo td:first-child { color: var(--fg3); }
  table.demo td:last-child { text-align: right; color: var(--fg1); }
  .num-col { font-family: var(--font-numeric); font-variant-numeric: tabular-nums; font-feature-settings: "tnum","lnum"; font-weight: 600; letter-spacing: -0.015em; }
  .role { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg4); }
  .neg { color: var(--money-negative); }
  .pos { color: var(--money-positive); }
</style></head>
<body><div class="card">
  <div class="row" style="gap: 32px;">
    <table class="demo" style="max-width: 320px;">
      <tr><td>Aluguel</td><td class="num-col">−800,00</td></tr>
      <tr><td>Mercado</td><td class="num-col neg">−142,55</td></tr>
      <tr><td>Salário</td><td class="num-col pos">+2.480,00</td></tr>
      <tr><td>NOS internet</td><td class="num-col neg">−44,00</td></tr>
      <tr><td>Pet — vet</td><td class="num-col neg">−92,00</td></tr>
    </table>
    <div class="col" style="gap: 10px;">
      <span class="role">Família · Geist 600</span>
      <span class="role">font-variant-numeric: tabular-nums</span>
      <span class="role">Negativos: sinal <span style="color:var(--money-negative)">−</span> + cor</span>
      <span class="role">Nunca parênteses</span>
      <span class="role">Formato: 1.240,50 (PT-BR)</span>
    </div>
  </div>
</div></body></html>

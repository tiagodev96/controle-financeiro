<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="_base.css">
<style>
  .scale-row { display: grid; grid-template-columns: 88px 1fr; align-items: baseline; gap: 24px; padding: 6px 0; border-bottom: 1px solid var(--border-soft); }
  .scale-row:last-child { border-bottom: 0; }
  .scale-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg4); letter-spacing: -0.01em; }
  .scale-sample { color: var(--fg1); letter-spacing: -0.015em; }
</style></head>
<body><div class="card">
  <div class="col" style="gap: 0;">
    <div class="scale-row"><span class="scale-meta">h1 · 28/600</span><span class="scale-sample" style="font-size:28px;font-weight:600;line-height:1.1">Dashboard</span></div>
    <div class="scale-row"><span class="scale-meta">h2 · 22/600</span><span class="scale-sample" style="font-size:22px;font-weight:600">Próximos 7 dias</span></div>
    <div class="scale-row"><span class="scale-meta">h3 · 18/600</span><span class="scale-sample" style="font-size:18px;font-weight:600">Top categorias</span></div>
    <div class="scale-row"><span class="scale-meta">body · 15/400</span><span class="scale-sample" style="font-size:15px;font-weight:400;color:var(--fg2)">Pagamento da fatura do cartão</span></div>
    <div class="scale-row"><span class="scale-meta">sm · 13/500</span><span class="scale-sample" style="font-size:13px;font-weight:500;color:var(--fg3)">3 dias atrás · Owner</span></div>
    <div class="scale-row"><span class="scale-meta">eyebrow · 11/600</span><span class="scale-sample" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg3)">Recorrente · Parcela 3/10</span></div>
  </div>
</div></body></html>

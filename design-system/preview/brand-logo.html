<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Logo / wordmark</title>
<link rel="stylesheet" href="_base.css">
<style>
  .stage { display: grid; grid-template-columns: 180px 1fr; gap: 32px; align-items: center; }
  .mark {
    width: 100px; height: 100px; border: 1px solid var(--border);
    border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
    background: var(--bg-base); position: relative;
  }
  .mark svg { width: 56px; height: 56px; }
  .wm {
    display: flex; align-items: baseline; gap: 1px;
    font-family: var(--font-sans); font-weight: 700;
    color: var(--fg1); letter-spacing: -0.04em;
    font-size: 36px; line-height: 1;
  }
  .wm .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--brand); display: inline-block; margin-left: 4px; transform: translateY(-2px); }
  .sub { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg3); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
  .tokens { display: flex; flex-direction: column; gap: 4px; }
  .tok { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg4); letter-spacing: -0.01em; }
</style></head>
<body><div class="card">
  <div class="stage">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke="none">
        <rect x="6" y="8" width="52" height="48" rx="3" stroke="var(--fg2)" stroke-width="1.5"/>
        <line x1="14" y1="22" x2="50" y2="22" stroke="var(--border-strong)" stroke-width="1"/>
        <line x1="14" y1="30" x2="42" y2="30" stroke="var(--border-strong)" stroke-width="1"/>
        <line x1="14" y1="38" x2="46" y2="38" stroke="var(--border-strong)" stroke-width="1"/>
        <line x1="14" y1="46" x2="36" y2="46" stroke="var(--border-strong)" stroke-width="1"/>
        <rect x="42" y="42" width="10" height="2" fill="var(--brand)"/>
      </svg>
    </div>
    <div>
      <div class="wm">controle<span style="color:var(--fg3);font-weight:400">·</span>cf<span class="dot"></span></div>
      <div class="sub">Livro-razão pessoal de um casal.</div>
      <div class="tokens" style="margin-top: 14px">
        <span class="tok">wordmark · Geist 700 · −0.04em</span>
        <span class="tok">brass dot · accent fixo direita</span>
        <span class="tok">mark · livro de razão miniatura (ledger ícone)</span>
      </div>
    </div>
  </div>
</div></body></html>

<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="_base.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: var(--radius-sm); }
  .ic svg { width: 22px; height: 22px; stroke: var(--fg2); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ic .n { font-family: var(--font-mono); font-size: 10px; color: var(--fg4); }
  .role { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg4); }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span class="n">dashboard</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span class="n">lancar</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 4h14v17l-3-2-2 2-2-2-2 2-2-2-3 2V4z"/><path d="M9 9h6M9 13h6"/></svg><span class="n">transações</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="1"/><path d="M2 10h20"/></svg><span class="n">dívidas</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 16-5"/><path d="M19 4v4h-4"/><path d="M21 12a9 9 0 0 1-16 5"/><path d="M5 20v-4h4"/></svg><span class="n">recorrente</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 9.5l9-6 9 6V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/></svg><span class="n">moradia</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16l-2 12H6L4 7zM8 3h8v4H8z"/></svg><span class="n">pet</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 5.5-9 10-9 10z"/></svg><span class="n">saúde</span></div>
  </div>
  <span class="role">Lucide · stroke 1.6 · linecap round · 22px @ nav / 14–16px inline. NUNCA emoji.</span>
</div></body></html>

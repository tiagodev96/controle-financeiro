<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--fg3); letter-spacing: 0.10em; text-transform: uppercase; }
.scale { display: flex; align-items: flex-end; gap: 10px; height: 80px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bar { background: linear-gradient(180deg, #2BF0B5, #00946A); border-radius: 4px; width: 28px; }
.t { font-family: var(--font-mono); font-size: 9px; color: var(--fg3); }
.l { font-family: var(--font-body); font-size: 10px; color: var(--fg2); font-weight: 600; }
</style></head><body>
<div class="eyebrow">Spacing scale · 4px base</div>
<div class="scale">
  <div class="step"><div class="bar" style="height:4px"></div><div class="l">1</div><div class="t">4 px</div></div>
  <div class="step"><div class="bar" style="height:8px"></div><div class="l">2</div><div class="t">8 px</div></div>
  <div class="step"><div class="bar" style="height:12px"></div><div class="l">3</div><div class="t">12 px</div></div>
  <div class="step"><div class="bar" style="height:16px"></div><div class="l">4</div><div class="t">16 px</div></div>
  <div class="step"><div class="bar" style="height:20px"></div><div class="l">5</div><div class="t">20 px</div></div>
  <div class="step"><div class="bar" style="height:24px"></div><div class="l">6</div><div class="t">24 px</div></div>
  <div class="step"><div class="bar" style="height:32px"></div><div class="l">8</div><div class="t">32 px</div></div>
  <div class="step"><div class="bar" style="height:40px"></div><div class="l">10</div><div class="t">40 px</div></div>
  <div class="step"><div class="bar" style="height:48px"></div><div class="l">12</div><div class="t">48 px</div></div>
  <div class="step"><div class="bar" style="height:64px"></div><div class="l">16</div><div class="t">64 px</div></div>
</div>
</body></html>

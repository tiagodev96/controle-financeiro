<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 20px 24px; }
.eyebrow { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--fg3); letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 14px; }
.row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--fg2); letter-spacing: 0.02em; }
input, select { background: var(--bg-inset); border: 1px solid var(--line-strong); color: var(--fg1); border-radius: 10px; padding: 10px 12px; font-family: var(--font-body); font-size: 14px; outline: none; transition: all 120ms ease; }
input::placeholder { color: var(--fg3); }
input:focus { border-color: #00E5A0; box-shadow: 0 0 0 4px rgba(0,229,160,0.18); }
.amount { display: flex; align-items: center; gap: 8px; background: var(--bg-inset); border: 1px solid var(--line-strong); border-radius: 10px; padding: 4px 12px; }
.amount .ccy { font-family: var(--font-mono); color: var(--fg3); font-size: 14px; }
.amount input { background: transparent; border: none; padding: 8px 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; width: 100%; }
.amount input:focus { box-shadow: none; }
.err input { border-color: rgba(255,92,92,0.6); box-shadow: 0 0 0 4px rgba(255,92,92,0.12); }
.err .label { color: #FF8A8A; }
.help { font-family: var(--font-body); font-size: 11px; color: var(--fg3); }
.help.error { color: #FF8A8A; }
</style></head><body>
<div class="eyebrow">Form fields</div>
<div class="row">
  <div class="field">
    <label class="label">Expense name</label>
    <input type="text" value="Spotify Family" />
    <span class="help">Auto-detected from your bank.</span>
  </div>
  <div class="field">
    <label class="label">Amount</label>
    <div class="amount"><span class="ccy">$</span><input type="text" value="14.99" /></div>
    <span class="help">Charged monthly · variable</span>
  </div>
  <div class="field err">
    <label class="label">Due day</label>
    <input type="text" value="32" />
    <span class="help error">Must be a day between 1 and 31.</span>
  </div>
</div>
</body></html>

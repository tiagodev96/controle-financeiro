<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 22px 24px; }
.eyebrow { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--fg3); letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-family: var(--font-body); font-weight: 600; font-size: 12px; border: 1px solid; }
.pill .dot { width: 6px; height: 6px; border-radius: 999px; }
.paid    { background: rgba(43,240,181,0.10); color: #2BF0B5; border-color: rgba(43,240,181,0.40); }
.paid .dot    { background: #2BF0B5; box-shadow: 0 0 8px #2BF0B5; }
.pending { background: rgba(255,178,62,0.10); color: #FFB23E; border-color: rgba(255,178,62,0.40); }
.pending .dot { background: #FFB23E; box-shadow: 0 0 8px #FFB23E; }
.overdue { background: rgba(255,92,92,0.10); color: #FF8A8A; border-color: rgba(255,92,92,0.45); }
.overdue .dot { background: #FF5C5C; box-shadow: 0 0 8px #FF5C5C; animation: pulse 1.4s infinite; }
@keyframes pulse { 50%{ opacity: 0.3; } }
.leak    { background: rgba(255,92,92,0.10); color: #FF8A8A; border-color: rgba(255,92,92,0.45); padding-left: 10px; }
.leak svg { width: 12px; height: 12px; }
.cat { background: rgba(255,255,255,0.05); color: var(--fg2); border-color: var(--line); }
.tag-rec { background: rgba(148,66,255,0.10); color: #C99BFF; border-color: rgba(148,66,255,0.40); }
.tag-parc { background: rgba(0,229,160,0.08); color: #2BF0B5; border-color: rgba(43,240,181,0.40); }
.tag-debt { background: rgba(255,184,0,0.10); color: #FFC93C; border-color: rgba(255,184,0,0.40); }
</style></head><body>
<div class="eyebrow">Pills de status e marcadores</div>
<div class="row" style="margin-bottom: 14px">
  <div class="pill paid"><span class="dot"></span>Pago</div>
  <div class="pill pending"><span class="dot"></span>Pendente · 2d</div>
  <div class="pill overdue"><span class="dot"></span>Em atraso · 5d</div>
</div>
<div class="row">
  <div class="pill cat">Mercado</div>
  <div class="pill cat">Moradia</div>
  <div class="pill cat">Pet</div>
  <div class="pill tag-rec">Recorrente</div>
  <div class="pill tag-parc">Parcela 3/10</div>
  <div class="pill tag-debt">Dívida em aberto</div>
</div>
</body></html>

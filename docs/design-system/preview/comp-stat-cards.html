<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 18px 22px; }
.eyebrow { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--fg3); letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 14px; }
.row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.card { background: var(--bg-surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; position: relative; overflow: hidden; }
.surplus::before {
  content: ""; position: absolute; inset: -50% -10% auto auto; width: 60%; height: 200%;
  background: radial-gradient(circle, rgba(0,229,160,0.18), transparent 60%);
  pointer-events: none;
}
.label { font-family: var(--font-body); font-size: 11px; color: var(--fg3); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 36px; line-height: 1; margin-top: 8px; }
.value .ccy { font-size: 22px; color: var(--fg3); margin-right: 4px; font-weight: 500; }
.value .num { color: var(--teal-300); }
.delta { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 12px; color: var(--teal-300); margin-top: 8px; }
.fixed .value .num { color: var(--fg1); }
.fixed .delta { color: var(--red-400); }
.tag { position: absolute; top: 16px; right: 16px; font-family: var(--font-mono); font-size: 10px; color: var(--fg3); }
</style></head><body>
<div class="eyebrow">Cartões · Sobra prevista + Custos fixos</div>
<div class="row">
  <div class="card surplus">
    <div class="label">Sobra prevista · este mês</div>
    <div class="value"><span class="ccy">€</span><span class="num">612</span><span style="color:var(--fg3)">,40</span></div>
    <div class="delta">▲ +€148 vs. mês anterior</div>
    <div class="tag">Previsão</div>
  </div>
  <div class="card fixed">
    <div class="label">Custos fixos do mês</div>
    <div class="value"><span class="ccy">€</span><span class="num">2.150</span><span style="color:var(--fg3)">,00</span></div>
    <div class="delta">▲ +€47 vs. mês anterior</div>
  </div>
</div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 18px 20px; }
.scale { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; height: 96px; }
.swatch { display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
.s-label { font-family: var(--font-body); font-size: 10px; font-weight: 600; }
.s-hex { font-family: var(--font-mono); font-size: 9px; opacity: 0.75; margin-top: 2px; }
h4.title { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--fg2); letter-spacing: 0.02em; }
.head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.tag { font-family: var(--font-mono); font-size: 10px; color: var(--fg3); }
</style></head><body>
<div class="head">
  <h4 class="title">Teal — Money / Growth / Primary</h4>
  <span class="tag">--teal-50 → 900</span>
</div>
<div class="scale">
  <div class="swatch" style="background:#E6FFF7;color:#04211A"><div class="s-label">50</div><div class="s-hex">#E6FFF7</div></div>
  <div class="swatch" style="background:#B8FFE8;color:#04211A"><div class="s-label">100</div><div class="s-hex">#B8FFE8</div></div>
  <div class="swatch" style="background:#7BFFD3;color:#04211A"><div class="s-label">200</div><div class="s-hex">#7BFFD3</div></div>
  <div class="swatch" style="background:#2BF0B5;color:#04211A"><div class="s-label">300</div><div class="s-hex">#2BF0B5</div></div>
  <div class="swatch" style="background:#00E5A0;color:#04211A;box-shadow:inset 0 0 0 2px #fff8"><div class="s-label">400 ★</div><div class="s-hex">#00E5A0</div></div>
  <div class="swatch" style="background:#00C089;color:#04211A"><div class="s-label">500</div><div class="s-hex">#00C089</div></div>
  <div class="swatch" style="background:#00946A;color:#F4F7FB"><div class="s-label">600</div><div class="s-hex">#00946A</div></div>
  <div class="swatch" style="background:#056F52;color:#F4F7FB"><div class="s-label">700</div><div class="s-hex">#056F52</div></div>
  <div class="swatch" style="background:#094E3B;color:#F4F7FB"><div class="s-label">800</div><div class="s-hex">#094E3B</div></div>
</div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 18px 20px; }
.row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; height: 130px; }
.swatch { border-radius: 10px; border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; position: relative; overflow: hidden; }
.name { font-family: var(--font-body); font-weight: 600; font-size: 11px; color: var(--fg1); }
.hex  { font-family: var(--font-mono); font-size: 9px; color: var(--fg3); margin-top: 2px; }
.tier { position: absolute; top: 8px; left: 10px; font-family: var(--font-mono); font-size: 9px; color: var(--fg3); text-transform: uppercase; letter-spacing: 0.08em; }
</style></head><body>
<div class="row">
  <div class="swatch" style="background:#07090F">
    <div class="tier">Void</div>
    <div class="name">bg-void</div><div class="hex">#07090F</div>
  </div>
  <div class="swatch" style="background:#0B0F19">
    <div class="tier">Base</div>
    <div class="name">bg-base</div><div class="hex">#0B0F19</div>
  </div>
  <div class="swatch" style="background:#0E1320">
    <div class="tier">Inset</div>
    <div class="name">bg-inset</div><div class="hex">#0E1320</div>
  </div>
  <div class="swatch" style="background:#121826">
    <div class="tier">Surface</div>
    <div class="name">bg-surface</div><div class="hex">#121826</div>
  </div>
  <div class="swatch" style="background:#1A2236">
    <div class="tier">Elevated</div>
    <div class="name">bg-elevated</div><div class="hex">#1A2236</div>
  </div>
</div>
</body></html>

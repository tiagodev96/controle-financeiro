<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 22px 24px; }
.eyebrow { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--fg3); letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 14px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button { font-family: var(--font-body); font-weight: 600; font-size: 14px; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid transparent; transition: all 120ms ease; }
.primary { background: #00E5A0; color: #04211A; box-shadow: 0 0 0 1px rgba(0,229,160,0.32), 0 0 24px -8px rgba(0,229,160,0.7); }
.primary:hover { background: #2BF0B5; box-shadow: 0 0 0 1px rgba(0,229,160,0.45), 0 0 32px -6px rgba(0,229,160,0.85); }
.secondary { background: var(--bg-elevated); color: var(--fg1); border-color: var(--line-strong); }
.secondary:hover { background: #243056; }
.ghost { background: transparent; color: var(--fg2); border-color: var(--line); }
.ghost:hover { background: var(--bg-surface); color: var(--fg1); }
.danger { background: rgba(255,92,92,0.12); color: #FF8A8A; border-color: rgba(255,92,92,0.45); }
.danger:hover { background: rgba(255,92,92,0.22); color: #FFD2D2; }
.icon { display: inline-flex; align-items: center; gap: 8px; }
.icon svg { width: 16px; height: 16px; }
.disabled { opacity: 0.4; pointer-events: none; }
</style></head><body>
<div class="eyebrow">Botões</div>
<div class="row">
  <button class="primary icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    Marcar como pago
  </button>
  <button class="secondary">Lançar despesa</button>
  <button class="ghost">Cancelar</button>
  <button class="danger icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    Excluir
  </button>
  <button class="primary disabled">Desabilitado</button>
</div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 16px 22px; }
.eyebrow { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--fg3); letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 4px; }
.specimen { font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 1.0; letter-spacing: -0.035em; color: var(--fg1); margin-bottom: 8px; }
.specimen .accent { color: var(--teal-300); }
.row { display: flex; gap: 22px; align-items: baseline; margin-top: 6px; }
.spec { font-family: var(--font-display); color: var(--fg1); }
.spec .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg3); margin-left: 6px; font-weight: 400; }
</style></head><body>
<div class="eyebrow">Display · Space Grotesk</div>
<div class="specimen">Level up your <span class="accent">money.</span></div>
<div class="row">
  <div class="spec" style="font-size:28px; font-weight:600;">Headline 28<span class="label">600 / h2</span></div>
  <div class="spec" style="font-size:22px; font-weight:600;">Card 22<span class="label">600 / h3</span></div>
  <div class="spec" style="font-size:18px; font-weight:500;">Sub 18<span class="label">500 / h4</span></div>
</div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 20px 24px; }
.row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.card {
  border-radius: 14px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--line);
}
.dot { width: 36px; height: 36px; border-radius: 999px; flex-shrink: 0; }
.body { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.name { font-family: var(--font-body); font-weight: 700; font-size: 13px; }
.use  { font-family: var(--font-body); font-size: 11px; color: var(--fg3); }
.hex  { font-family: var(--font-mono); font-size: 10px; color: var(--fg2); margin-top: 4px; }

.paid    { background: rgba(43,240,181,0.10); border-color: rgba(43,240,181,0.32); }
.paid .dot { background: #2BF0B5; box-shadow: 0 0 20px -4px #2BF0B5; }
.paid .name { color: #2BF0B5; }

.pending { background: rgba(255,178,62,0.10); border-color: rgba(255,178,62,0.32); }
.pending .dot { background: #FFB23E; box-shadow: 0 0 20px -4px #FFB23E; }
.pending .name { color: #FFB23E; }

.overdue { background: rgba(255,92,92,0.10); border-color: rgba(255,92,92,0.32); }
.overdue .dot { background: #FF5C5C; box-shadow: 0 0 20px -4px #FF5C5C; }
.overdue .name { color: #FF5C5C; }
</style></head><body>
<div class="row">
  <div class="card paid">
    <div class="dot"></div>
    <div class="body">
      <div class="name">Pago</div>
      <div class="use">Confirmado, em dia</div>
      <div class="hex">--paid-400 · #2BF0B5</div>
    </div>
  </div>
  <div class="card pending">
    <div class="dot"></div>
    <div class="body">
      <div class="name">Pendente</div>
      <div class="use">Vence em até 3 dias</div>
      <div class="hex">--amber-400 · #FFB23E</div>
    </div>
  </div>
  <div class="card overdue">
    <div class="dot"></div>
    <div class="body">
      <div class="name">Em atraso</div>
      <div class="use">Passou da data</div>
      <div class="hex">--red-400 · #FF5C5C</div>
    </div>
  </div>
</div>
</body></html>

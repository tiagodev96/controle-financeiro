<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 16px 22px; display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--fg3); letter-spacing: 0.10em; text-transform: uppercase; }
.hero { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; font-weight: 600; font-size: 56px; line-height: 1; letter-spacing: -0.02em; color: var(--fg1); }
.hero .currency { color: var(--teal-300); font-size: 32px; vertical-align: 8px; margin-right: 4px; font-weight: 500; }
.row { display: flex; gap: 28px; align-items: baseline; }
.item { display: flex; flex-direction: column; gap: 2px; }
.label { font-family: var(--font-body); font-size: 11px; color: var(--fg3); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 22px; color: var(--fg1); }
.num.pos { color: var(--teal-300); }
.num.neg { color: var(--red-400); }
.tag { font-family: var(--font-mono); font-size: 10px; color: var(--fg4); }
</style></head><body>
<div class="eyebrow">Numérico · JetBrains Mono · tabular-nums</div>
<div class="hero"><span class="currency">€</span>1.240<span style="color:var(--fg3)">,50</span></div>
<div class="row">
  <div class="item"><span class="label">Entrada</span><span class="num pos">+ € 4.820,00</span></div>
  <div class="item"><span class="label">Fixos</span><span class="num">€ 2.150,00</span></div>
  <div class="item"><span class="label">Em atraso</span><span class="num neg">− € 47,00</span></div>
  <div class="item"><span class="label">Δ vs. mês ant.</span><span class="num pos">+ 12,4%</span></div>
</div>
</body></html>

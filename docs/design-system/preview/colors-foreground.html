<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 20px 24px; display: flex; flex-direction: column; gap: 4px; }
.row { display: grid; grid-template-columns: 130px 60px 80px 1fr; align-items: center; column-gap: 18px; padding: 6px 0; border-bottom: 1px dashed var(--line-soft); }
.row:last-child { border-bottom: none; }
.name { font-family: var(--font-mono); font-size: 12px; color: var(--fg1); }
.swatch { width: 100%; height: 28px; border-radius: 6px; border: 1px solid var(--line); }
.hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg3); }
.sample { font-family: var(--font-body); font-size: 14px; }
</style></head><body>
<div class="row">
  <div class="name">--fg1</div>
  <div class="swatch" style="background:#F4F7FB"></div>
  <div class="hex">#F4F7FB</div>
  <div class="sample" style="color:#F4F7FB">Primary — headings, numbers, key copy.</div>
</div>
<div class="row">
  <div class="name">--fg2</div>
  <div class="swatch" style="background:#B7C0D1"></div>
  <div class="hex">#B7C0D1</div>
  <div class="sample" style="color:#B7C0D1">Secondary — body, labels, sub-headings.</div>
</div>
<div class="row">
  <div class="name">--fg3</div>
  <div class="swatch" style="background:#7C8699"></div>
  <div class="hex">#7C8699</div>
  <div class="sample" style="color:#7C8699">Tertiary — placeholder, meta, captions.</div>
</div>
<div class="row">
  <div class="name">--fg4</div>
  <div class="swatch" style="background:#4A536A"></div>
  <div class="hex">#4A536A</div>
  <div class="sample" style="color:#4A536A">Disabled — inactive text, ghost icons.</div>
</div>
</body></html>

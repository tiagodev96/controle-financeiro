<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 22px 24px; }
.eyebrow { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--fg3); letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 14px; }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.col { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.card { width: 100%; height: 90px; border-radius: 14px; background: var(--bg-surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--fg2); font-family: var(--font-mono); font-size: 11px; }
.s1 { box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 1px 2px rgba(0,0,0,0.40); }
.s2 { box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 6px 24px -8px rgba(0,0,0,0.55); }
.s3 { box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 18px 48px -16px rgba(0,0,0,0.70); }
.tok { font-family: var(--font-body); font-weight: 600; font-size: 12px; color: var(--fg1); }
.use { font-family: var(--font-body); font-size: 11px; color: var(--fg3); }
</style></head><body>
<div class="eyebrow">Shadow / Elevation — sparing on dark UI</div>
<div class="row">
  <div class="col"><div class="card s1">surface-1</div><div class="tok">shadow-1</div><div class="use">Resting cards, list rows</div></div>
  <div class="col"><div class="card s2">surface-2</div><div class="tok">shadow-2</div><div class="use">Popovers, dropdowns</div></div>
  <div class="col"><div class="card s3">surface-3</div><div class="tok">shadow-3</div><div class="use">Modals, sheets</div></div>
</div>
</body></html>

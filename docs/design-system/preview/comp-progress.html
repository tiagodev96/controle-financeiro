<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--fg3); letter-spacing: 0.10em; text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 16px; }
.lbl { font-family: var(--font-body); font-weight: 600; font-size: 12px; color: var(--fg2); width: 110px; }
.bar { flex: 1; height: 10px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; position: relative; }
.fill { height: 100%; border-radius: 999px; }
.teal   { background: linear-gradient(90deg, #00C089, #2BF0B5); box-shadow: 0 0 10px -2px #2BF0B5; }
.purple { background: linear-gradient(90deg, #7B27E8, #AB6CFF); box-shadow: 0 0 10px -2px #9442FF; }
.gold   { background: linear-gradient(90deg, #B07700, #FFC93C); box-shadow: 0 0 10px -2px #FFB800; }
.red    { background: linear-gradient(90deg, #B11E2A, #FF5C5C); }
.val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--fg3); min-width: 80px; text-align: right; }
.seg { display: flex; gap: 4px; flex: 1; }
.seg .s { flex: 1; height: 6px; border-radius: 2px; background: rgba(255,255,255,0.06); }
.seg .s.on { background: var(--teal-300); box-shadow: 0 0 8px -1px var(--teal-300); }
.seg .s.warn { background: var(--amber-400); }
.seg .s.off { background: rgba(255,255,255,0.06); }
</style></head><body>
<div class="eyebrow">Barras de progresso · orçamento, meta, caixinha</div>
<div class="row">
  <div class="lbl">Meta · Viagem</div>
  <div class="bar"><div class="fill purple" style="width:64%"></div></div>
  <div class="val">€ 2.840 / 4.500</div>
</div>
<div class="row">
  <div class="lbl">Orçamento Mercado</div>
  <div class="bar"><div class="fill teal" style="width:72%"></div></div>
  <div class="val">€ 347 / 482</div>
</div>
<div class="row">
  <div class="lbl">Limite Lazer</div>
  <div class="bar"><div class="fill red" style="width:96%"></div></div>
  <div class="val">€ 115,60 / 120</div>
</div>
<div class="row">
  <div class="lbl">Caixinha · Cacau</div>
  <div class="seg">
    <div class="s on"></div><div class="s on"></div><div class="s on"></div>
    <div class="s on"></div><div class="s on"></div><div class="s warn"></div>
    <div class="s off"></div>
  </div>
  <div class="val">5 de 7</div>
</div>
</body></html>

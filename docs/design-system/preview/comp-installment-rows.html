<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 18px 22px; }
.eyebrow { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--fg3); letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 12px; }
.card { background: var(--bg-surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 36px 1.4fr 110px 90px 100px; align-items: center; column-gap: 14px; padding: 12px 16px; border-top: 1px solid var(--line-soft); }
.row:first-child { border-top: none; }
.row:hover { background: var(--bg-elevated); }
.dot { width: 8px; height: 8px; border-radius: 999px; justify-self: center; }
.title { font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--fg1); }
.sub { font-family: var(--font-body); font-size: 11px; color: var(--fg3); margin-top: 2px; }
.due { font-family: var(--font-mono); font-size: 12px; color: var(--fg2); }
.amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; text-align: right; color: var(--fg1); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-family: var(--font-body); font-weight: 600; font-size: 11px; border: 1px solid; justify-self: end; }
.pill .pd { width: 5px; height: 5px; border-radius: 999px; }
.paid { background: rgba(43,240,181,0.10); color: #2BF0B5; border-color: rgba(43,240,181,0.40); }
.paid .pd { background: #2BF0B5; }
.pending { background: rgba(255,178,62,0.10); color: #FFB23E; border-color: rgba(255,178,62,0.40); }
.pending .pd { background: #FFB23E; }
.overdue { background: rgba(255,92,92,0.10); color: #FF8A8A; border-color: rgba(255,92,92,0.45); }
.overdue .pd { background: #FF5C5C; animation: p 1.4s infinite; }
@keyframes p { 50%{opacity:.3} }
.dot.p { background: #2BF0B5; }
.dot.w { background: #FFB23E; }
.dot.o { background: #FF5C5C; }
</style></head><body>
<div class="eyebrow">Linhas de parcela / recorrente</div>
<div class="card">
  <div class="row">
    <div class="dot p"></div>
    <div><div class="title">Aluguel</div><div class="sub">Recorrente · todo dia 5</div></div>
    <div class="due">05 jul</div>
    <div class="amount">€ 800,00</div>
    <div class="pill paid"><span class="pd"></span>Pago</div>
  </div>
  <div class="row">
    <div class="dot w"></div>
    <div><div class="title">NOS · Internet</div><div class="sub">Recorrente · débito automático</div></div>
    <div class="due">18 jul · em 2d</div>
    <div class="amount">€ 44,00</div>
    <div class="pill pending"><span class="pd"></span>Pendente</div>
  </div>
  <div class="row">
    <div class="dot o"></div>
    <div><div class="title">Passagens Brasil</div><div class="sub">Parcela 3/10</div></div>
    <div class="due">10 jul · −5d</div>
    <div class="amount">€ 197,20</div>
    <div class="pill overdue"><span class="pd"></span>Em atraso</div>
  </div>
</div>
</body></html>

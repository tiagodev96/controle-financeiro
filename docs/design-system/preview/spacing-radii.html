<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--fg3); letter-spacing: 0.10em; text-transform: uppercase; }
.row { display: flex; gap: 14px; align-items: center; }
.sample { background: linear-gradient(135deg, #1A2236, #121826); border: 1px solid var(--line); width: 80px; height: 72px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
.cap { font-family: var(--font-mono); font-size: 10px; color: var(--fg2); }
.tok { font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--fg1); }
.usage { font-family: var(--font-body); font-size: 11px; color: var(--fg3); margin-top: 2px; }
.col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
</style></head><body>
<div class="eyebrow">Corner radii</div>
<div class="row">
  <div class="col"><div class="sample" style="border-radius:6px"><span class="cap">6</span></div><div class="tok">sm</div><div class="usage">chips, dense rows</div></div>
  <div class="col"><div class="sample" style="border-radius:10px"><span class="cap">10</span></div><div class="tok">md</div><div class="usage">inputs, buttons</div></div>
  <div class="col"><div class="sample" style="border-radius:14px"><span class="cap">14</span></div><div class="tok">lg ★</div><div class="usage">default cards</div></div>
  <div class="col"><div class="sample" style="border-radius:18px"><span class="cap">18</span></div><div class="tok">xl</div><div class="usage">hero cards, modals</div></div>
  <div class="col"><div class="sample" style="border-radius:24px"><span class="cap">24</span></div><div class="tok">2xl</div><div class="usage">onboarding panels</div></div>
  <div class="col"><div class="sample" style="border-radius:999px;width:72px"><span class="cap">∞</span></div><div class="tok">pill</div><div class="usage">badges, status</div></div>
</div>
</body></html>
